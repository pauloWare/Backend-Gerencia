# ============================================================================
# Configuração EXCLUSIVA dos testes automatizados (não afeta produção).
# Banco em memória H2: os testes rodam sem SQL Server/PostgreSQL disponível.
# ============================================================================
spring.datasource.url=jdbc:h2:mem:academia-test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.defer-datasource-initialization=true

# Cria os índices únicos (mesma intenção dos scripts em db/security-hardening/),
# permitindo testar duplicidade em requisições simultâneas.
spring.sql.init.mode=always

app.security.jwt.secret=chave-de-teste-com-tamanho-suficiente-para-hs256-2026
app.security.jwt.expiration-minutes=120

# Ativação por código: validade curta nos testes (expiração testável).
app.ativacao.validade-minutos=60

# CORS: o SecurityConfig lê esta propriedade via @Value sem default e o
# application.properties principal é sombreado pelo arquivo de teste, então ela
# precisa estar definida aqui (mesmos padrões do ambiente de dev).
app.cors.allowed-origin-patterns=http://localhost:*,http://127.0.0.1:*,http://192.168.0.32:*,https://gerencia-sigma.vercel.app,https://gerencia-gsdy7lqhm-paulowares-projects.vercel.app
