server.port=8080
spring.application.name=AcademiaBRMW

# Conexão SQL Server Local
#
# A URL pode ser sobrescrita via variável de ambiente SPRING_DATASOURCE_URL, se
# necessário para deploy em outro banco.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:sqlserver://localhost:1433;databaseName=academiaINF2CN;encrypt=true;trustServerCertificate=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER:com.microsoft.sqlserver.jdbc.SQLServerDriver}

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
# Em produção (Render/hospedagem) configure SPRING_JPA_SHOW_SQL=false para não
# registrar o SQL executado nos logs.
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=true

# ============================================================================
# AUTENTICAÇÃO POR TOKEN (JWT HS256)
# ----------------------------------------------------------------------------
# app.security.jwt.secret  -> DEVE ser configurado por variável de ambiente
#                             (JWT_SECRET) em produção, com no mínimo 32
#                             caracteres. Se não for informado, uma chave
#                             aleatória é gerada a cada inicialização (uso
#                             local/teste: os tokens deixam de valer após
#                             reiniciar o servidor).
# app.security.jwt.expiration-minutes -> tempo de vida do token (padrão 120).
# ============================================================================
app.security.jwt.secret=${JWT_SECRET:}
app.security.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:120}

# ============================================================================
# UPLOAD DE IMAGENS (Base64 no banco)
# ----------------------------------------------------------------------------
# app.upload.foto-max-bytes -> tamanho máximo aceito para a foto de perfil do
# aluno, já em Base64 (data URL). ~1.000.000 caracteres ≈ 750 KB de imagem.
# A imagem é validada (PNG/JPEG/WEBP) e gravada na tabela `aluno`, que é
# persistente: a foto continua disponível depois de fechar o aplicativo, sair
# da conta e após reinícios/novos deploys do servidor.
# ============================================================================
app.upload.foto-max-bytes=${FOTO_PERFIL_MAX_BYTES:1000000}

# ============================================================================
# ATIVAÇÃO DA CONTA MOBILE (código de uso único)
# ----------------------------------------------------------------------------
# app.ativacao.validade-minutos -> prazo do código gerado no cadastro
# (padrão 4320 = 3 dias). Após expirar, a recepção gera outro em
# POST /api/aluno/{id}/codigo-ativacao.
# ============================================================================
app.ativacao.validade-minutos=${ATIVACAO_VALIDADE_MINUTOS:4320}

# ============================================================================
# CORS — origens do FRONTEND autorizadas a chamar a API (não é o endereço da API)
# ----------------------------------------------------------------------------
# app.cors.allowed-origin-patterns -> padrões separados por vírgula, sobrescre-
# veis pela variável de ambiente CORS_ALLOWED_ORIGIN_PATTERNS (veja .env.example).
# Padrão: Vite, Expo Web/Go em localhost/127.0.0.1 e no IP local da rede, e o
# domínio do Vercel em produção. Nunca usamos "*".
# ============================================================================
app.cors.allowed-origin-patterns=${CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:*,http://127.0.0.1:*,http://192.168.0.32:*,https://gerencia-sigma.vercel.app,https://gerencia-gsdy7lqhm-paulowares-projects.vercel.app}

# O dialeto abaixo é opcional nas versões novas, o Hibernate detecta sozinho
# spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect

# ============================================================================
# JACKSON — desserialização tolerante a strings vazias
# ----------------------------------------------------------------------------
# O formulário envia "" quando um campo opcional não é preenchido
# (ex.: dataNascimento). Sem isto, "" em um LocalDate quebra a
# desserialização ANTES da validação e o POST /api/aluno devolve 400
# genérico ("Dados obrigatórios ausentes ou em formato inválido").
# Com a flag, "" vira null e cai na validação normal de negócio.
# ============================================================================
spring.jackson.deserialization.accept-empty-string-as-null-object=true
