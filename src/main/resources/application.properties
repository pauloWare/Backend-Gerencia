server.port=8080
spring.application.name=AcademiaBRMW

# Conexão SQL Server Local
#
# A URL pode ser sobrescrita via variável de ambiente SPRING_DATASOURCE_URL, se
# necessário para deploy em outro banco.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:sqlserver://localhost:1433;databaseName=academiaINF2CN;encrypt=true;trustServerCertificate=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER:com.microsoft.sqlserver.jdbc.SQLServerDriver}

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
# Em produção (Render/hospedagem) configure SPRING_JPA_SHOW_SQL=false para não
# registrar o SQL executado nos logs.
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=true

# ============================================================================
# AUTENTICAÇÃO POR TOKEN (JWT HS256)
# ----------------------------------------------------------------------------
# app.security.jwt.secret  -> DEVE ser configurado por variável de ambiente
#                             (JWT_SECRET) em produção, com no mínimo 32
#                             caracteres. Se não for informado, uma chave
#                             aleatória é gerada a cada inicialização (uso
#                             local/teste: os tokens deixam de valer após
#                             reiniciar o servidor).
# app.security.jwt.expiration-minutes -> tempo de vida do token (padrão 120).
# ============================================================================
app.security.jwt.secret=${JWT_SECRET:}
app.security.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:120}
# O dialeto abaixo é opcional nas versões novas, o Hibernate detecta sozinho
# spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect
