server.port=8080
spring.application.name=AcademiaBRMW

# Conexão SQL Server Local
#
# A URL pode ser sobrescrita via variável de ambiente SPRING_DATASOURCE_URL, se
# necessário para deploy em outro banco.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:sqlserver://localhost:1433;databaseName=academiaINF2CN;encrypt=true;trustServerCertificate=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER:com.microsoft.sqlserver.jdbc.SQLServerDriver}

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# O dialeto abaixo é opcional nas versões novas, o Hibernate detecta sozinho
# spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect
