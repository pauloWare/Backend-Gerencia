server.port=${PORT:8080}
spring.application.name=AcademiaBRMW

# Conexão com o Banco de Dados (configurável via variáveis de ambiente)
# Local (fallback): SQL Server
# Produção (Render/Supabase): PostgreSQL
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:sqlserver://localhost:1433;databaseName=academiaINF2CN;encrypt=true;trustServerCertificate=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:@ITB123456}
# O driver é detectado automaticamente pelo Spring Boot baseado na URL da conexão.
# Para sobrescrever, definir a variável SPRING_DATASOURCE_DRIVER no ambiente.
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER:}

# JPA/Hibernate
# O dialect é detectado automaticamente pelo Hibernate baseado na URL da conexão.
# Local: SQLServerDialect | Produção: PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true